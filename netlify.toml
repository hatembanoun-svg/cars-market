# رؤوس الأمان — سياسة CSP مفعّلة (Enforcing).
# إن ظهر شيء معطّل في الموقع بعد النشر، افتح Console المتصفح (F12) وابحث عن رسالة
# "Refused to ..."، وأرسلها لي. للتراجع المؤقت غيّر اسم الرأس إلى
# Content-Security-Policy-Report-Only (يسجّل المخالفات دون حجب).

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://unpkg.com https://www.google.com/recaptcha/ https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://firestore.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com/recaptcha/ https://www.recaptcha.net; worker-src 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com https://www.recaptcha.net; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# ملف الـ Service Worker يجب ألا يُخزَّن حتى تصل التحديثات فوراً
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
